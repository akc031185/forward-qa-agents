# Template only — do not apply as-is or commit a real token. Copy, fill in the value with
# `openssl rand -hex 32` (or generate with `kubectl create secret generic ... --from-literal=`
# instead of storing it in a checked-in file at all), and apply that. The same value must be set
# on the calling app's side as AUDIT_WORKER_TOKEN so it can authenticate to this worker.
apiVersion: v1
kind: Secret
metadata:
  name: audit-worker-token
  namespace: ai-site-auditor
type: Opaque
stringData:
  AUDIT_WORKER_TOKEN: "REPLACE-ME-generate-with-openssl-rand--hex-32"
